name: 코드·학습 회귀 검증
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run test:operations
      - run: npm run test:release-config
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/exam-request.spec.ts e2e/readiness.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
